name: dsh

services:
  dsh:
    image: dsh
    container_name: dsh-web
    ports:
      - "${DSH_PORT:-9090}:9090"
    volumes:
      # Harness 主目录：会话、设置、web profile、认证凭据（web-auth.json）。
      - ./dsh-data:/data
      # agent 工作区：宿主机目录挂到 /workspace；入口脚本把 HOME 指到它。
      - ./workspace:/workspace
      # 每日日志源：宿主机目录放前一天日志压缩包 → 工作区内 daily/<源名>，
      # 定时任务读包分析、报告写回同目录（宿主机即可见）。新增日志源 =
      # 再加一行挂载到 /workspace/logAnalyze/daily/<源名>，然后在网页建定时任务。
      - ${DSH_DEMOSITE_LOG_DIR:-/opt/dsh-web/demosite-log}:/workspace/logAnalyze/daily/demosite
    environment:
      # 模型访问（聊天必需）。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 可选：自定义 DeepSeek 兼容端点（默认 https://api.deepseek.com）。
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      # 浏览器实际访问用的 host:port（域名则不带端口），空格分隔可多个。
      # 原版 CLI 的 --trusted-host 透传；dsh-web-startup-auth 自身的认证
      # 不依赖它（远程一律要求登录），但留空可能导致部分检查 403，建议配好。
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      # 自定义大模型提供方（JSON 字典，启动时合并进数据卷 settings.yaml；
      # 未声明 input 的模型默认支持识图，DSH_PROVIDERS_DEFAULT_VISION=0 关闭）。
      DSH_LLM_PROVIDERS: ${DSH_LLM_PROVIDERS:-}
      DSH_PROVIDERS_DEFAULT_VISION: ${DSH_PROVIDERS_DEFAULT_VISION:-}
      # 权限预设：默认 danger-full-access（免沙盒免审批）。workspace-write 需
      # 宿主内核支持 Landlock（或容器内有 bwrap），否则沙箱 fail-closed，每条
      # 命令都弹审批、定时任务会卡死（2026-09-17 服务器实测）。本机开发若内核
      # 支持可设 workspace-write 开沙箱（仅工作区内可写）。
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-danger-full-access}
    restart: unless-stopped
